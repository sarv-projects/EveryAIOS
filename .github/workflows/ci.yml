# EveryAIOS — Rust workspace CI (P0.1)
# Runs cargo test + clippy + fmt on every push/PR, on all 3 desktop platforms.

name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  # Fix 2 — capabilities.yaml == ARCH/09 == spec §0, and TODO.md header counts
  # match the file. Fast (no build); catches index-level drift on every PR.
  docs-sync:
    name: docs-sync (capability index + TODO counts)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run doc-sync check
        run: node scripts/check-doc-sync.mjs

  rust:
    name: cargo test/clippy/fmt (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: crates
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates

      # SQLCipher (bundled) requires OpenSSL for encryption.
      # Linux: libssl-dev is preinstalled on ubuntu-latest runners.
      # macOS: LibreSSL ships with Xcode CLI tools (already available).
      # Windows: install via vcpkg and set OPENSSL_DIR + link system libs.
      - name: Install OpenSSL (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          vcpkg install openssl:x64-windows-static-md
          echo "OPENSSL_DIR=C:\vcpkg\installed\x64-windows-static-md" >> $env:GITHUB_ENV
          echo "OPENSSL_STATIC=1" >> $env:GITHUB_ENV
          # OpenSSL static needs these Windows system libs at link time
          $libs = "-Clink-arg=advapi32.lib -Clink-arg=user32.lib -Clink-arg=crypt32.lib -Clink-arg=gdi32.lib"
          echo "RUSTFLAGS=-D warnings $libs" >> $env:GITHUB_ENV

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy --all-targets
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: cargo test
        run: cargo test --all-features

  # P4.5 — LibreOffice headless oracle (D6/D7 conformance gate). The office
  # engines' surgical patch must round-trip through a real LibreOffice parse
  # without a repair warning. This is a separate job (LO install is heavy) and
  # runs on ubuntu only — the oracle is deterministic regardless of host.
  office-oracle:
    name: office LibreOffice oracle
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crates
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates

      - name: Install LibreOffice (writer)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libreoffice-writer

      - name: LibreOffice oracle (docx patch round-trip)
        run: >-
          cargo test -p everyaios-office --lib
          conformance::tests::live_oracle_opens_clean
          -- --ignored --test-threads=1
        env:
          EVERYAIOS_LIVE_TEST: "1"

  # UI: self-contained (own package-lock.json, no @personal-ai deps) — always runs.
  ui:
    name: ui typecheck + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install deps
        working-directory: ui
        run: npm ci
      - name: Typecheck
        working-directory: ui
        run: npm run type-check
      - name: Build
        working-directory: ui
        run: npm run build
      # P10.5 "vitest": the UI's unit tests (lib/*.test.ts — NPS timing,
      # session recording, stagger) run under bun, which the lockfile pins.
      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Unit tests (bun test)
        working-directory: ui
        run: bun test

  # Sidecar: coordinator bun tests + typecheck. The @personal-ai/core-*
  # engine packages are vendored in-repo under packages/core-*, so this job
  # needs no private-repo token and always runs.
  sidecar:
    name: coordinator bun test + typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: desktop_app
      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install workspace deps
        working-directory: desktop_app
        run: |
          npm install -g pnpm
          pnpm install
      # Fail loudly if the reused @personal-ai/core-* engine packages are not
      # vendored in-repo. This is the explicit replacement for the dropped
      # APP_CLONE_TOKEN gate: building the sidecar must NEVER silently succeed
      # against a missing/typosquatted core dependency when the workspace is
      # incomplete. Each core-* dep below must (a) be declared in the
      # coordinator's package.json and (b) resolve to packages/core-* in this
      # repo — a missing dir or an external "workspace" mapping is a hard fail.
      - name: Verify vendored core-* packages (fail loudly)
        working-directory: desktop_app
        shell: bash
        run: |
          set -euo pipefail
          # The coordinator's @personal-ai/* direct deps (mirrors package.json).
          need=(core-ai core-connectors core-engine core-providers core-search)
          err=0
          for p in "${need[@]}"; do
            pkg="packages/$p"
            if [ ! -d "$pkg" ] || [ ! -f "$pkg/package.json" ]; then
              echo "::error::vendored package '$pkg' is MISSING — the coordinator would fail only later, loudly"; err=1
            fi
            if ! grep -q "\"@personal-ai/$p\"" packages/coordinator/package.json; then
              echo "::error::coordinator does not depend on '@personal-ai/$p' but vendored '$pkg' exists — mismatch"; err=1
            fi
          done
          # Belt-and-suspenders: confirm the workspace glob actually resolves them.
          if ! grep -q '"packages/\*"' pnpm-workspace.yaml; then
            echo "::error::pnpm-workspace.yaml no longer globs 'packages/*' — vendored core-* would resolve externally"; err=1
          fi
          if [ "$err" -ne 0 ]; then exit 1; fi
          echo "core-* packages verified vendored in-repo (${#need[@]})"
      # dist/ is gitignored for the vendored engine packages, so a fresh
      # checkout has no .d.ts to resolve — build them before typecheck/tests
      # (mirrors what a local dev flow does).
      - name: Build vendored core-* packages
        working-directory: desktop_app
        run: pnpm --filter './packages/core-*' run build
      - name: Coordinator typecheck
        working-directory: desktop_app/packages/coordinator
        run: bun run type-check
      - name: Coordinator tests
        working-directory: desktop_app/packages/coordinator
        run: bun test

  # P10.5 — "cargo test + vitest + Tauri build for Win/Mac/Linux": the Tauri
  # shell itself must type-check on all 3 platforms, not just at release time.
  # cargo check is the fast gate; the release workflow does the full signed
  # bundle build.
  tauri-check:
    name: tauri shell check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates, src-tauri

      - name: Install Linux packaging deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            patchelf libssl-dev

      - name: Install OpenSSL (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          vcpkg install openssl:x64-windows-static-md
          echo "OPENSSL_DIR=C:\vcpkg\installed\x64-windows-static-md" >> $env:GITHUB_ENV
          echo "OPENSSL_STATIC=1" >> $env:GITHUB_ENV
          $libs = "-Clink-arg=advapi32.lib -Clink-arg=user32.lib -Clink-arg=crypt32.lib -Clink-arg=gdi32.lib"
          echo "RUSTFLAGS=$libs" >> $env:GITHUB_ENV

      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install pnpm
        run: npm install -g pnpm

      # tauri.conf.json declares `"resources": ["bin/coordinator*"]`, and
      # tauri-build hard-fails when that glob matches nothing. The sidecar is
      # gitignored and only exists after a bun --compile, so produce it here
      # (release.yml does the same before bundling). The vendored core-*
      # engines must be built first — bun resolves them via their `main`
      # (dist/index.js).
      - name: Build coordinator sidecar (tauri resource glob)
        # GITHUB_WORKSPACE is the repo root (the tauri-check job's default
        # working-directory is src-tauri, so override back to the root).
        working-directory: .
        shell: bash
        run: |
          pnpm install
          pnpm --filter './packages/core-*' run build
          mkdir -p packages/coordinator/dist
          pnpm --filter @everyaios/coordinator build
          mkdir -p src-tauri/bin
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp packages/coordinator/dist/coordinator.exe src-tauri/bin/coordinator.exe
          else
            cp packages/coordinator/dist/coordinator src-tauri/bin/coordinator
          fi

      - name: cargo check (tauri shell)
        run: cargo check

      - name: cargo test --lib (tauri shell)
        run: cargo test --lib
