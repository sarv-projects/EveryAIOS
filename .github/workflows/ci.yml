# EveryAIOS — Rust workspace CI (P0.1)
# Runs cargo test + clippy + fmt on every push/PR, on all 3 desktop platforms.

name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  rust:
    name: cargo test/clippy/fmt (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: crates
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates

      # SQLCipher (bundled) requires OpenSSL for encryption.
      # Linux: libssl-dev is preinstalled on ubuntu-latest runners.
      # macOS: LibreSSL ships with Xcode CLI tools (already available).
      # Windows: install via vcpkg and set OPENSSL_DIR + link system libs.
      - name: Install OpenSSL (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          vcpkg install openssl:x64-windows-static-md
          echo "OPENSSL_DIR=C:\vcpkg\installed\x64-windows-static-md" >> $env:GITHUB_ENV
          echo "OPENSSL_STATIC=1" >> $env:GITHUB_ENV
          # OpenSSL static needs these Windows system libs at link time
          $libs = "-Clink-arg=advapi32.lib -Clink-arg=user32.lib -Clink-arg=crypt32.lib -Clink-arg=gdi32.lib"
          echo "RUSTFLAGS=-D warnings $libs" >> $env:GITHUB_ENV

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy --all-targets
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: cargo test
        run: cargo test --all-features

  # P4.5 — LibreOffice headless oracle (D6/D7 conformance gate). The office
  # engines' surgical patch must round-trip through a real LibreOffice parse
  # without a repair warning. This is a separate job (LO install is heavy) and
  # runs on ubuntu only — the oracle is deterministic regardless of host.
  office-oracle:
    name: office LibreOffice oracle
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crates
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates

      - name: Install LibreOffice (writer)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libreoffice-writer

      - name: LibreOffice oracle (docx patch round-trip)
        run: >-
          cargo test -p everyaios-office --lib
          conformance::tests::live_oracle_opens_clean
          -- --ignored --test-threads=1
        env:
          EVERYAIOS_LIVE_TEST: "1"

  # UI: self-contained (own package-lock.json, no @personal-ai deps) — always runs.
  ui:
    name: ui typecheck + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install deps
        working-directory: ui
        run: npm ci
      - name: Typecheck
        working-directory: ui
        run: npm run type-check
      - name: Build
        working-directory: ui
        run: npm run build
      # P10.5 "vitest": the UI's unit tests (lib/*.test.ts — NPS timing,
      # session recording, stagger) run under bun, which the lockfile pins.
      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Unit tests (bun test)
        working-directory: ui
        run: bun test

  # Sidecar: coordinator bun tests + typecheck. Needs the private APP repo
  # (sarv-projects/APP — the @personal-ai/core-* packages) checked out as a
  # sibling of this repo (pnpm-workspace.yaml: `../APP/packages/*`). Configure
  # a fine-grained PAT with read access to sarv-projects/APP as the
  # APP_CLONE_TOKEN secret; without it this required job fails loudly.
  sidecar:
    name: coordinator bun test + typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: desktop_app
      - name: Check out APP (core packages) — needs APP_CLONE_TOKEN
        if: secrets.APP_CLONE_TOKEN != ''
        env:
          APP_CLONE_TOKEN: ${{ secrets.APP_CLONE_TOKEN }}
        uses: actions/checkout@v4
        with:
          repository: sarv-projects/APP
          path: APP
          token: ${{ secrets.APP_CLONE_TOKEN }}
      - name: Require APP clone token
        if: secrets.APP_CLONE_TOKEN == ''
        env:
          APP_CLONE_TOKEN: ${{ secrets.APP_CLONE_TOKEN }}
        run: |
          echo "::error::APP_CLONE_TOKEN secret is required — coordinator tests must not be skipped"
          exit 1
      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install workspace deps
        if: secrets.APP_CLONE_TOKEN != ''
        env:
          APP_CLONE_TOKEN: ${{ secrets.APP_CLONE_TOKEN }}
        working-directory: desktop_app
        run: |
          npm install -g pnpm
          pnpm install
      - name: Coordinator typecheck
        if: secrets.APP_CLONE_TOKEN != ''
        env:
          APP_CLONE_TOKEN: ${{ secrets.APP_CLONE_TOKEN }}
        working-directory: desktop_app/packages/coordinator
        run: bun run type-check
      - name: Coordinator tests
        if: secrets.APP_CLONE_TOKEN != ''
        env:
          APP_CLONE_TOKEN: ${{ secrets.APP_CLONE_TOKEN }}
        working-directory: desktop_app/packages/coordinator
        run: bun test

  # P10.5 — "cargo test + vitest + Tauri build for Win/Mac/Linux": the Tauri
  # shell itself must type-check on all 3 platforms, not just at release time.
  # cargo check is the fast gate; the release workflow does the full signed
  # bundle build.
  tauri-check:
    name: tauri shell check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates, src-tauri

      - name: Install Linux packaging deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            patchelf libssl-dev

      - name: Install OpenSSL (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          vcpkg install openssl:x64-windows-static-md
          echo "OPENSSL_DIR=C:\vcpkg\installed\x64-windows-static-md" >> $env:GITHUB_ENV
          echo "OPENSSL_STATIC=1" >> $env:GITHUB_ENV
          $libs = "-Clink-arg=advapi32.lib -Clink-arg=user32.lib -Clink-arg=crypt32.lib -Clink-arg=gdi32.lib"
          echo "RUSTFLAGS=$libs" >> $env:GITHUB_ENV

      - name: cargo check (tauri shell)
        run: cargo check

      - name: cargo test --lib (tauri shell)
        run: cargo test --lib
