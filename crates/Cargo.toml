[workspace]
resolver = "2"
members = [
    "everyaios-core",
    "everyaios-ipc",
    "everyaios-guard",
    "everyaios-audit",
    "everyaios-vault",
    "everyaios-cdp",
    "everyaios-browser",
    "everyaios-script",
    "everyaios-mcp",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.80"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
regex = "1"
rusqlite = { version = "0.31", features = ["bundled-sqlcipher"] }
toml = "0.8"
