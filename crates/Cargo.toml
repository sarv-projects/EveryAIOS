[workspace]
resolver = "2"
members = [
    "everyaios-core",
    "everyaios-ipc",
    "everyaios-guard",
    "everyaios-audit",
    "everyaios-vault",
    "everyaios-cdp",
    "everyaios-browser",
    "everyaios-script",
    "everyaios-mcp",
    "everyaios-office",
    "everyaios-storage",
    "everyaios-memory",
    "everyaios-eval",
    "everyaios-blueprint",
    "everyaios-codeintel",
    "everyaios-acp",
    "everyaios-search",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.80"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
regex = "1"
rusqlite = { version = "0.31", features = ["bundled-sqlcipher"] }
toml = "0.8"
ureq = { version = "2", features = ["tls", "json"] }
zeroize = { version = "1", features = ["derive"] }
rand = "0.8"
opentelemetry = "0.27"
sha2 = "0.10"
argon2 = "0.5"
sha1 = "0.10"
base64 = "0.22"
tokio = { version = "1", features = ["rt", "net", "time", "macros", "sync"] }
tokio-tungstenite = "0.24"
futures-util = "0.3"
url = "2"
zip = "2"
similar = "2"
roxmltree = "0.20"
flate2 = "1"
crc32fast = "1"
tar = "0.4"
