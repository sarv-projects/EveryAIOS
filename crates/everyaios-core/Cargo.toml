[package]
name = "everyaios-core"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "EveryAIOS orchestrator binary — boots headless, loads config, supervises sidecar"

[dependencies]
everyaios-ipc = { path = "../everyaios-ipc" }
everyaios-vault = { path = "../everyaios-vault" }
everyaios-guard = { path = "../everyaios-guard" }
everyaios-memory = { path = "../everyaios-memory" }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
thiserror = { workspace = true }
sha2 = { workspace = true }
rand = { workspace = true }
opentelemetry = { workspace = true }
ureq = { workspace = true }
sysinfo = "0.30"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
    # CreateJobObjectW takes a SECURITY_ATTRIBUTES pointer — the link is
    # gated behind the Win32_Security feature in windows-sys 0.61.
    "Win32_Security",
] }
