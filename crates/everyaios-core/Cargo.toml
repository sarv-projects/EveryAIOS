[package]
name = "everyaios-core"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "EveryAIOS orchestrator binary — boots headless, loads config, supervises sidecar"

[dependencies]
everyaios-ipc = { path = "../everyaios-ipc" }
everyaios-types = { path = "../everyaios-types" }
everyaios-vault = { path = "../everyaios-vault" }
everyaios-guard = { path = "../everyaios-guard" }
everyaios-memory = { path = "../everyaios-memory" }
everyaios-blueprint = { path = "../everyaios-blueprint" }
everyaios-mcp = { path = "../everyaios-mcp" }
everyaios-audit = { path = "../everyaios-audit" }
everyaios-script = { path = "../everyaios-script" }
everyaios-storage = { path = "../everyaios-storage" }
everyaios-eval = { path = "../everyaios-eval" }
everyaios-office = { path = "../everyaios-office" }
everyaios-search = { path = "../everyaios-search" }
serde = { workspace = true }
serde_json = { workspace = true }
urlencoding = { workspace = true }
base64 = { workspace = true }
chacha20poly1305 = { workspace = true }
x25519-dalek = { workspace = true }
toml = { workspace = true }
thiserror = { workspace = true }
sha2 = { workspace = true }
argon2 = { workspace = true }
rand = { workspace = true }
opentelemetry = { workspace = true }
ureq = { workspace = true }
sysinfo = "0.30"

[dev-dependencies]
# P10 E2E/bench suites — browser tree/diff/ownership compose the pipeline
# tests and the snapshot/tab benchmarks (production build unaffected).
everyaios-browser = { path = "../everyaios-browser" }
# TabRegistry::sync_targets takes cdp TargetInfo (the ownership stress bench).
everyaios-cdp = { path = "../everyaios-cdp" }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
    # CreateJobObjectW takes a SECURITY_ATTRIBUTES pointer — the link is
    # gated behind the Win32_Security feature in windows-sys 0.61.
    "Win32_Security",
] }
