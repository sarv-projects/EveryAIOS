[package]
name = "everyaios-computeruse"
# NOTE: renamed from "everyaios-desktop" to avoid the package-name collision
# with the src-tauri shell (also "everyaios-desktop"). Docs may still say
# "the everyaios-desktop engine" for E9; this is that crate.
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "E9 desktop computer-use — see/read/act/verify over native windows (X11 live, Win UIA+SendInput+PrintWindow, macOS AX+ScreenCapture), OCR vision fallback, layer-1-first router, Guard-2 policy"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
image = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.13", features = ["xtest"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_UI_Accessibility",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_Graphics_Gdi",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    # `ShellExecuteExW` / `SHELLEXECUTEINFOW` are gated behind this in windows 0.58.
    "Win32_System_Registry",
    "Win32_System_Com",
    "Win32_Storage_Xps",
    # P57.6 — Windows.Graphics.Capture (occluded-window capture): the WinRT
    # capture surface, a BGRA-capable D3D11 device, and the DXGI interop that
    # maps the captured surface onto an ID3D11Texture2D.
    "Foundation",
    "UI",
    "Graphics_Capture",
    "Graphics_DirectX",
    "Graphics_DirectX_Direct3D11",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_System_WinRT",
    "Win32_System_WinRT_Direct3D11",
] }
