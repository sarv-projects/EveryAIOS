[package]
name = "everyaios-desktop"
version = "0.1.0"
description = "EveryAIOS — agentic desktop OS shell (Tauri v2)"
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.80"

[lib]
name = "everyaios_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-updater = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
# P70.C2 — the channel-aware updater builds endpoint URLs from strings.
url = "2"
# P70.C4 — the periodic update-check loop shares the runtime the plugin uses.
tokio = { version = "1", features = ["time"] }
# P63 — scrub the raw provider key the moment an agent's spawn env is built
# (`agent_backend_cmds`). The vault already zeroizes internally; this keeps
# the shell's own copy of the value from lingering in the heap.
zeroize = "1"

# EveryAIOS Rust core — path deps into the crates workspace. The core owns
# config, vault, guard, audit and IPC; the shell just exposes it to the UI.
everyaios-core = { path = "../crates/everyaios-core" }
everyaios-ipc = { path = "../crates/everyaios-ipc" }
everyaios-vault = { path = "../crates/everyaios-vault" }
everyaios-audit = { path = "../crates/everyaios-audit" }
everyaios-guard = { path = "../crates/everyaios-guard" }
everyaios-office = { path = "../crates/everyaios-office" }
everyaios-catalog = { path = "../crates/everyaios-catalog" }
everyaios-acp = { path = "../crates/everyaios-acp" }
everyaios-mcp = { path = "../crates/everyaios-mcp" }
everyaios-storage = { path = "../crates/everyaios-storage" }
everyaios-browser = { path = "../crates/everyaios-browser" }
everyaios-cdp = { path = "../crates/everyaios-cdp" }
everyaios-codeintel = { path = "../crates/everyaios-codeintel" }
everyaios-agents = { path = "../crates/everyaios-agents" }
# P69.D1/D25 — the canonical agent/element schema lives in `everyaios-types`;
# the shell reads the same record shape the crates and the TS façade use.
everyaios-types = { path = "../crates/everyaios-types" }
everyaios-blueprint = { path = "../crates/everyaios-blueprint" }
everyaios-script = { path = "../crates/everyaios-script" }
everyaios-computeruse = { path = "../crates/everyaios-desktop", package = "everyaios-computeruse" }

[profile.release]
strip = true
lto = true
codegen-units = 1
