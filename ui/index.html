<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EveryAIOS</title>
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        margin: 0;
        box-sizing: border-box;
      }
      body {
        font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
        background: radial-gradient(1200px 800px at 50% -10%, #1e1b4b 0%, #0b1020 60%);
        color: #e2e8f0;
        min-height: 100vh;
        display: grid;
        place-items: center;
      }
      .card {
        text-align: center;
        padding: 48px;
      }
      .logo {
        width: 96px;
        height: 96px;
        margin: 0 auto 24px;
        border-radius: 22px;
        background: linear-gradient(180deg, #7c3aed, #2563eb);
        display: grid;
        place-items: center;
        font-weight: 800;
        font-size: 48px;
        color: #fff;
        box-shadow: 0 12px 40px rgba(124, 58, 237, 0.35);
      }
      h1 {
        font-size: 28px;
        font-weight: 700;
        letter-spacing: -0.02em;
      }
      p {
        margin-top: 12px;
        color: #94a3b8;
        font-size: 14px;
      }
      .status {
        margin-top: 28px;
        padding: 10px 18px;
        border: 1px solid #334155;
        border-radius: 999px;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        font-size: 13px;
        color: #cbd5e1;
      }
      .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #22c55e;
        animation: pulse 2s ease-in-out infinite;
      }
      @keyframes pulse {
        50% {
          opacity: 0.35;
        }
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="logo">E</div>
      <h1>EveryAIOS</h1>
      <p>Agentic desktop OS — shell booting…</p>
      <div class="status"><span class="dot"></span><span id="status">core: connecting</span></div>
    </div>
    <script>
      // P0.2: verify the Tauri command bridge to the Rust core is alive.
      const status = document.getElementById("status");
      async function ping() {
        try {
          const v = await window.__TAURI__.core.invoke("version");
          const report = await window.__TAURI__.core.invoke("core_boot_report");
          status.textContent = "core: " + v.split("(")[0].trim() + " — " + report.split("—").pop().trim();
        } catch (e) {
          status.textContent = "core: unreachable (" + String(e).slice(0, 60) + ")";
        }
      }
      if (window.__TAURI__) {
        ping();
      } else {
        status.textContent = "core: not in Tauri context (static preview)";
      }
    </script>
  </body>
</html>
