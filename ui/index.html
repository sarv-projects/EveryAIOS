<!doctype html>
<html lang="en" class="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="EveryAIOS — agentic desktop OS. Browser, office, code, shell — one cockpit, one timeline, one approval at a time."
    />
    <title>EveryAIOS — Agentic Desktop OS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <!-- P55.12 — apply the stored theme before the bundle paints, so a saved
         choice never flashes the default. Same key + owner as ThemeProvider. -->
    <script>
      try {
        var t = localStorage.getItem('everyaios.theme')
        if (t === 'light' || t === 'dark') {
          document.documentElement.classList.remove('light', 'dark')
          document.documentElement.classList.add(t)
        }
      } catch (e) { /* storage unavailable — keep the markup default */ }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
